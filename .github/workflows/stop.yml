
name: Stop Minecraft Server

on:
  workflow_dispatch:

jobs:
  stop:
    runs-on: ubuntu-latest

    steps:
      - name: Send stop command through Pico
        run: |
          curl --fail --show-error --max-time 15 \
            "http://${{ secrets.WOL_PICO_IP }}:54322/stop/${{ secrets.STOP_PICO_TOKEN }}"
