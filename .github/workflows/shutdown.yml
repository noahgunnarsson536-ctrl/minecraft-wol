
name: Shut Down Minecraft PC

on:
  workflow_dispatch:

jobs:
  shutdown:
    runs-on: ubuntu-latest

    steps:
      - name: Request PC shutdown through Pico
        run: |
          curl --fail --show-error --max-time 15 \
            "http://${{ secrets.WOL_PICO_IP }}:54322/shutdown/${{ secrets.SHUTDOWN_TOKEN }}"
