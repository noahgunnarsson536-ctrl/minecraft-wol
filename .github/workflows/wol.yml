name: Wake Minecraft Server

on:
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest

    steps:
      - name: Send Wake-on-LAN packet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wakeonlan
          wakeonlan -i "${{ secrets.WOL_IP }}" -p "${{ secrets.WOL_PORT }}" "${{ secrets.WOL_MAC }}"
