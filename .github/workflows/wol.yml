name: Wake Minecraft Server

on:
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest

    steps:
      - name: Send Wake-on-LAN packet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wakeonlan

          echo "Sending WOL packet..."
          echo "Target: ${{ secrets.WOL_IP }}:${{ secrets.WOL_PORT }}"
          echo "MAC: ${{ secrets.WOL_MAC }}"

          wakeonlan \
            -i "${{ secrets.WOL_IP }}" \
            -p "${{ secrets.WOL_PORT }}" \
            "${{ secrets.WOL_MAC }}"

          echo "WOL packet sent."
